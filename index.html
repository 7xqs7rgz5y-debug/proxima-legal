<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="index, follow" />
<title>Proxima — Legal</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#475569;--accent:#2563eb;--border:#e2e8f0}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#0f172a;--text:#f1f5f9;--muted:#cbd5e1;--accent:#60a5fa;--border:#1e293b}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
  .wrap{max-width:760px;margin:0 auto;padding:48px 22px 80px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#60a5fa,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
  h1{font-size:30px;letter-spacing:-.5px;margin:22px 0 6px}
  p{color:var(--muted);font-size:15px}
  .cards{display:flex;flex-direction:column;gap:14px;margin-top:26px}
  .doc{display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--text)}
  .doc:hover{border-color:var(--accent)}
  .doc strong{display:block;font-size:17px;letter-spacing:-.3px}
  .doc span{color:var(--muted);font-size:14px}
  footer{margin-top:44px;color:var(--muted);font-size:13px}
  a{color:var(--accent)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="logo">P</div>
      <span style="font-weight:800;letter-spacing:.5px">PROXIMA</span>
    </div>
    <h1>Legal</h1>
    <p>The Privacy Policy and Terms of Service for the Proxima task-manager app.</p>
    <div class="cards">
      <a class="doc" href="./privacy.html"><strong>Privacy Policy</strong><span>What we collect, how we use it, and your choices.</span></a>
      <a class="doc" href="./terms.html"><strong>Terms of Service</strong><span>The rules for using Proxima.</span></a>
    </div>
    <footer>© <span id="y"></span> Proxima. Questions? <a href="mailto:support@proxima.app">support@proxima.app</a></footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
